name: Repository Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tracked Markdown files
        shell: bash
        run: python scripts/validate_markdown.py

  documentation-links:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate local documentation links
        shell: bash
        run: python scripts/validate_doc_links.py

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic media runtime
        shell: bash
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -version
          ffprobe -version

      - name: Run unit tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest

          start_directory = Path("tests/unit")
          if not start_directory.is_dir():
              raise SystemExit("tests/unit does not exist in the repository checkout.")

          suite = unittest.defaultTestLoader.discover(
              str(start_directory),
              pattern="test_*.py",
          )
          count = suite.countTestCases()
          if count == 0:
              raise SystemExit("No unit tests were discovered; validation cannot pass.")

          print(f"Discovered {count} unit tests.")
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run contract tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest

          start_directory = Path("tests/contract")
          if not start_directory.is_dir():
              raise SystemExit("tests/contract does not exist in the repository checkout.")

          suite = unittest.defaultTestLoader.discover(
              str(start_directory),
              pattern="test_*.py",
          )
          count = suite.countTestCases()
          if count == 0:
              raise SystemExit("No contract tests were discovered; validation cannot pass.")

          print(f"Discovered {count} contract tests.")
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic media runtime
        shell: bash
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -version
          ffprobe -version

      - name: Run integration tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest

          start_directory = Path("tests/integration")
          if not start_directory.is_dir():
              raise SystemExit("tests/integration does not exist in the repository checkout.")

          suite = unittest.defaultTestLoader.discover(
              str(start_directory),
              pattern="test_*.py",
          )
          count = suite.countTestCases()
          if count == 0:
              raise SystemExit("No integration tests were discovered; validation cannot pass.")

          print(f"Discovered {count} integration tests.")
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Install deterministic media runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Run integration tests
        shell: bash
        run: |
          python - <<'PY'

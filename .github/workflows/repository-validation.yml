      - name: Record setup timing
        shell: bash
        run: python scripts/run_ci_fast_path.py mark-setup

      - name: Run documentation-link governance validation
        shell: bash
        run: python scripts/run_ci_fast_path.py run-job --job documentation-links

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify repository change scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/run_ci_fast_path.py classify \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record setup timing
        shell: bash
        run: python scripts/run_ci_fast_path.py mark-setup

      - name: Install deterministic media runtime for full suite
        if: env.CI_SCOPE == 'FULL_SUITE'
        shell: bash
        run: |
          started="$(date +%s)"
          installed=false
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
            installed=true
          fi
          ffmpeg -version
          ffprobe -version
          finished="$(date +%s)"
          echo "RUNTIME_INSTALL_SECONDS=$((finished - started))" >> "$GITHUB_ENV"
          echo "FFMPEG_INSTALL_EXECUTED=$installed" >> "$GITHUB_ENV"

      - name: Run Unit Tests required check
        shell: bash
        run: python scripts/run_ci_fast_path.py run-job --job unit


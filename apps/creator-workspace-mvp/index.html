        </header>

          <main id="app-content" tabindex="-1"></main>
          <aside class="inspector" id="inspector" aria-label="详情">
            <div class="inspector-heading">
              <div>
                <span>详情</span>
                <h2 id="inspector-title">当前内容</h2>
              </div>
              <button
                class="icon-button"
                type="button"
                data-action="toggle-inspector"
                aria-label="收起详情"
                aria-expanded="true"
              ><span aria-hidden="true">›</span></button>
            </div>
            <div id="inspector-content"></div>
          </aside>
        </div>

        <footer class="sticky-action-bar" id="sticky-action-bar" aria-label="当前页面操作"></footer>

    </div>

    <button
      class="inspector-fab"
      type="button"
      data-action="toggle-inspector"
      aria-label="打开详情"
      aria-expanded="false"
      hidden
    >
      <span aria-hidden="true">i</span>
    </button>

    <dialog class="modal" id="project-dialog" aria-labelledby="project-dialog-title">
      <form method="dialog" id="project-form">
        <div class="modal-heading">
          <div>
            <span class="eyebrow">临时项目草稿</span>
            <h2 id="project-dialog-title">创建项目草稿</h2>
          </div>
          <button class="icon-button" type="button" data-action="close-project-dialog" aria-label="关闭">×</button>
        </div>
        <div class="boundary-callout">
          <strong>仅当前会话有效</strong>
          <p>这个临时草稿不会保存到系统，刷新页面后将自动清除。</p>
        </div>
        <label class="field-label">
          项目名称
            <input name="title" maxlength="48" required placeholder="例如：晚灯 · 第 2 集">
        </label>
        <label class="field-label">
          内容格式
          <select name="format">
            <option value="竖屏短视频 · 9:16">竖屏短视频 · 9:16</option>
            <option value="横屏概念片 · 16:9">横屏概念片 · 16:9</option>
          </select>
        </label>
        <div class="modal-actions">
          <button class="button button-secondary" type="button" data-action="close-project-dialog">取消</button>
          <button class="button button-primary" type="submit">加入当前会话</button>
        </div>
      </form>
    </dialog>
